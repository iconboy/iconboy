name: WakaTime weekly

on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The secret context isn't available in job-level `if`, so gate it here.
      - name: Is WakaTime configured?
        id: gate
        env:
          KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [[ -n "$KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WAKATIME_API_KEY not set — skipping (see SETUP.md)"
          fi

      - name: Update the waka block
        if: steps.gate.outputs.ready == 'true'
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          COMMIT_MESSAGE: "chore: refresh wakatime stats [skip ci]"
