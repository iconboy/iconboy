name: Profile stats

on:
  schedule:
    # 06:10 UTC ≈ 03:10 in Brazil — daily refresh
    - cron: "10 6 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update-readme.mjs"
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate README blocks
        env:
          # classic PAT with `repo` + `read:user` so private repos are counted
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          SHOW_PRIVATE_NAMES: "false"
        run: node scripts/update-readme.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          else
            echo "no changes"
          fi
